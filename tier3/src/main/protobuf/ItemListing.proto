syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
option java_multiple_files = true;
option java_package = "dk.via.sep3.generated";

service ItemListingService {
  rpc AddItemListing (AddItemListingRequest) returns (google.protobuf.Empty);
  rpc GetItemListing (GetItemListingRequest) returns (ItemListingResponse);
  rpc UpdateItemListing (UpdateItemListingRequest) returns (google.protobuf.Empty);
  rpc RemoveItemListing (RemoveItemListingRequest) returns (google.protobuf.Empty);
  rpc GetListItemSummaries(ListItemListingSummaryRequest) returns (ListItemSummariesResponse);
  rpc GetItemThumbnails(ListItemThumbnailRequest) returns (GetItemThumbnailsResponse);
  rpc GetItemListingsByMember(ListItemListingforMemberRequest) returns (ListItemListingforMemberResponse);
}
service MemberService{
  rpc AddMember (AddMemberRequest) returns (MemberResponse);
  rpc GetMember (GetMemberRequest) returns (MemberResponse);
  rpc RemoveMember (RemoveMemberRequest) returns (google.protobuf.Empty);
  rpc Login (LoginRequest) returns (MemberResponse);
}
service ConversationService{
  rpc AddConversation (AddConversationRequest) returns (ConversationResponse);
  rpc GetConversation (GetConversationRequest) returns (ConversationResponse);
  rpc RemoveConversation (RemoveConversationRequest) returns (google.protobuf.Empty);
  rpc GetConversationSummaryList (ListConversationsSummaryRequest) returns (ListConversationSummaryResponse);
  rpc AddMessage (AddMessageRequest) returns (MessageResponse);
}
//------Section global variables-------
enum ImageFileType{
  PNG = 0;
  JPG = 1;
  JPEG = 2; //JPEG and JPG are interchangable filetypes, if preferable collapse into a single type, if not then store both
}
enum Category {
  UNSPECIFIED = 0;
  CLOTHING = 1;
  FOOTWEAR = 2;
  ELECTRONICS = 3;
  MAKEUP = 4;
  JEWELRY = 5;
  HOUSEHOLD_GOODS = 6;
  PRIVATE_SERVICES = 7;
  CURIOSITIES = 8;
  PET_SUPPLIES = 9;
  GARDENING = 10;
  OUTDOOR_GOODS = 11;
}

message Date {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}
message ItemThumbnail {
  int32 item_id = 1;
  ImageFileType filetype = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes data = 5;
}
message ItemSummary {
  int32 id = 1;
  string itemName = 2;
  string description = 3;
  int32 price = 4;
  int32 ownerId = 5;
  Date date = 6;
}
message ConversationSummary{
  int32 id = 1;
  int32 ownerId = 2;
  string itemName = 3;
}
// price 0 = no filtering, 1 = false (Low to High), 2 = true (High to Low)
// date 0 = no filtering, 1 = false (Recent to Old), 2 = true (Old to Recent)
message Filter{
  int32 price = 1;
  int32 date = 2;
}
//-----------Section entities-----------
message Image {
  int32 id = 1;
  string name = 2;
  ImageFileType filetype = 3;
  uint32 width = 4;
  uint32 height = 5;
  bytes data = 6;
}
message ItemListing {
  int32 id = 1;
  string itemName = 2;
  string memberName = 3;
  string description = 4;
  int32 price = 5;
  repeated Image images = 6;
  repeated Category categories = 7;
  Date date = 8;
  int32 ownerId = 9;
}
message Member {
  int32 id = 1;
  string memberName = 2;
  string memberEmail = 3;
  string firstName = 4;
  string lastName = 5;
}
message Message {
  int32 id = 1;
  int32 conversation_id = 2;
  int32 sender_id = 3;
  string content = 4;
  //https://www.baeldung.com/java-convert-google-protocol-buffer-timestamp-localdate
  google.protobuf.Timestamp created_at = 5;
}
message Conversation {
  int32 id = 1;
  repeated Message messages = 2;
}
//---------Rpc Requests and Responses--------

message AddItemListingRequest {
  string itemName = 1;
  string description = 2;
  int32 price = 3;
  repeated Category categories = 4;
  repeated Image images = 5;
  int32 ownerId= 6;
}
message AddImageRequest{
  int32 item_id= 1;
  Image image = 2;
}
message AddMemberRequest{
  string memberName = 1;
  string memberEmail = 2;
  string password = 3;
  string firstName = 4;
  string lastName = 5;
}
message AddConversationRequest{
  int32 ownerId = 1;
  int32 senderId = 2;
  int32  item_listing_id = 3;
}
message AddMessageRequest{
  int32 conversation_id = 1;
  int32 sender_id = 2;
  string content = 3;
}
message GetMemberRequest {
  int32 member_id = 1;
}
message GetItemListingRequest {
  int32 id = 1;
}
message GetConversationRequest{
  int32 id = 1;
}
message ListItemListingforMemberRequest{
  int32 member_id = 1;
}
message ListItemThumbnailRequest {
  repeated int32 item_ids = 1;
}
message ListItemListingSummaryRequest  {
  string title = 1;
  repeated Category categoryList = 2;
  Filter filter = 3;
  int32 counter = 4;
}

message ListConversationsSummaryRequest {
  int32 member_id = 1;
}
message UpdateItemListingRequest{
  int32  item_id = 1;
  string itemName = 2;
  string memberName = 3;
  string description = 4;
  int32 price = 5;
  repeated Category categories = 6;
  repeated Image images = 7;
}

message RemoveItemListingRequest{
  int32 item_id = 1;
}
message RemoveItemListingImageRequest{
  int32 item_id = 1;
  int32 image_id = 2;
}
message RemoveMemberRequest{
  int32 member_id = 1;
}
message RemoveConversationRequest{
  int32 conversation_id = 1;
}
message LoginRequest{
  string memberName = 1;
  string password = 2;
}
message ItemListingResponse {
  ItemListing itemlisting = 1;
}
message ListItemSummariesResponse {
  repeated ItemSummary items = 1;
}
message ListItemListingforMemberResponse {
  repeated ItemListing items = 1;
}
message GetItemThumbnailsResponse {
  repeated ItemThumbnail thumbnails = 1;
}
message ListConversationSummaryResponse {
  repeated ConversationSummary conversations = 1;
}
message ListMessagesResponse {
  repeated Message messageList = 1;
}
message ConversationResponse {
  Conversation conversation = 1;
}
message MessageResponse {
  Message message = 1;
}
message MemberResponse {
  Member member = 1;
}
